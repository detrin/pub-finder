<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meet Somewhere{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="/static/theme-init.js"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- App CSS -->
    <link rel="stylesheet" href="/static/app.css?v=23">
    <link rel="modulepreload" href="/static/reachability-map.js?v=2">
</head>
<body>
    <nav class="site-nav" aria-label="Primary navigation">
        <div class="site-nav__inner">
            <a class="brand" href="/" aria-label="Meet Somewhere home">
                <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
                    <path d="M7 34 20 21 41 12" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M7 34 20 21 41 12" fill="none" stroke="var(--coral)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="m8 12 14 14 19 9" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="m8 12 14 14 19 9" fill="none" stroke="var(--blue)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="21" cy="23" r="4" fill="var(--yellow)" stroke="var(--ink)" stroke-width="2"/>
                </svg>
                <span>meet somewhere</span>
            </a>
            <details class="site-nav__menu">
                <summary>Menu</summary>
                <div class="site-nav__links">
                <a href="/">Home</a>
                <a href="/how-it-works">How it works</a>
                <a href="/feedback">Feedback</a>
                <a href="https://github.com/detrin/pub-finder">GitHub</a>
                </div>
            </details>
            <button class="theme-toggle" data-theme-toggle aria-label="Use dark theme" title="Toggle theme">
                <svg class="theme-icon-light" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="theme-icon-dark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </nav>

    <div class="container">
        <main>
            {% block content %}{% endblock %}
        </main>

        <footer class="site-footer">
            <p>Created by <a href="https://www.hermandaniel.com">Daniel Herman</a> · <a href="https://github.com/detrin/pub-finder">GitHub</a></p>
        </footer>
    </div>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- App JS -->
    <script type="module" src="/static/app.js?v=16"></script>
    <script type="module" src="/static/results.js?v=3"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
