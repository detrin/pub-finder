<form hx-post="/session/{{ session_code }}/stops"
      hx-trigger="change target:[data-stop-input], change target:[data-same-start-end]"
      hx-sync="this:replace"
      hx-indicator="#stop-save-status-{{ participant.id }}"
      hx-target="#session-participants-inner" hx-swap="innerHTML"
      class="stop-form">
    <input type="hidden" name="participant_id" value="{{ participant.id }}">
    <div class="stop-form-row">
        <label data-field>
            Start
            <input type="text" name="start_stop" placeholder="Tap to select stop..."
                value="{{ participant.start_stop }}" readonly data-stop-input
                data-participant-name="{{ participant.name }}" data-stop-direction="starting from">
        </label>
        <label data-field>
            End
            <input type="text" name="end_stop" placeholder="Tap to select stop..."
                value="{{ participant.end_stop }}" readonly data-stop-input
                data-participant-name="{{ participant.name }}" data-stop-direction="returning to"
                {% if participant.same_start_end %}disabled{% endif %}>
        </label>
        <label class="stop-form-return">
            <input type="checkbox" name="same_start_end" value="true"
                {% if participant.same_start_end %}checked{% endif %}
                data-same-start-end>
            Return to the same stop
        </label>
    </div>
</form>
